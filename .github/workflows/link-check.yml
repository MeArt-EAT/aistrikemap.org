name: Link Check (V2)

on:
  schedule:
    # Weekly Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'data/incidents/**'
      - 'data/radar/**'
      - 'scripts/check-links-v2.js'
      - 'scripts/link-report-to-markdown.js'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-links-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache data/link-cache.json across runs so successive weekly runs
      # respect the 7-day TTL and only re-check URLs that actually need it.
      - name: Restore V2 link cache
        uses: actions/cache@v4
        with:
          path: data/link-cache.json
          key: v2-link-cache-${{ github.run_id }}
          restore-keys: |
            v2-link-cache-

      - name: Run V2 link-checker
        id: v2
        # `|| true` keeps the job green — we handle a non-zero exit
        # (dead links found) by opening an issue in the next step.
        run: node scripts/check-links-v2.js || true

      - name: Upload V2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-v2-report
          path: link-check-v2-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Summarise report for issue body
        if: always()
        id: summary
        run: |
          if [ ! -f link-check-v2-report.json ]; then
            echo "no-report=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Body is built by a script: inline bash turned the backticks around
          # the status code into command substitution and exceeded GitHub's
          # 65,536-character issue limit.
          dead=$(node scripts/link-report-to-markdown.js link-check-v2-report.json issue-body.md)
          echo "dead=$dead" >> "$GITHUB_OUTPUT"

      # Reuse the open link-check issue instead of opening a new one per run
      # (every push to data/ used to add another issue).
      - name: Find open link-check issue
        if: steps.summary.outputs.dead != '0' && steps.summary.outputs.dead != ''
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label link-check --state open --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update issue on dead links
        if: steps.summary.outputs.dead != '0' && steps.summary.outputs.dead != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link Check V2 — ${{ steps.summary.outputs.dead }} dead links"
          content-filepath: ./issue-body.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: |
            link-check
            automated
