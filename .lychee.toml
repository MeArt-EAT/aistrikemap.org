# Lychee link checker configuration
# https://lychee.cli.rs/

# How many requests in parallel
max_concurrency = 8

# Retry on transient failures
max_retries = 2
retry_wait_time = 5

# Treat these as success (rate-limited / bot-walls)
accept = [200, 206, 403, 429]

# Skip mail links
exclude_mail = true

# Common false positives — sites that block bots/lychee but are real
exclude = [
  "^https?://(www\\.)?linkedin\\.com",
  "^https?://(www\\.)?twitter\\.com",
  "^https?://(www\\.)?x\\.com",
  "^https?://(www\\.)?facebook\\.com",
  "^https?://(www\\.)?instagram\\.com",
  "^https?://web\\.archive\\.org",
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
]

# User agent so news sites don't 403 us immediately
user_agent = "Mozilla/5.0 (compatible; AIStrikeMap-LinkChecker/1.0; +https://aistrikemap.org)"

# Timeout per request
timeout = 20

# Cache results for a week to save bandwidth
cache = true
max_cache_age = "7d"
